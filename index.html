<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos Distrileco - Oficial</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --p: #0056b3; --s: #25D366; --e: #1D6F42; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; background: #f0f2f5; }
        .container { max-width: 750px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .logo-vibras { text-align: center; font-weight: bold; color: #ff9800; margin-bottom: 5px; font-style: italic; font-size: 24px; text-shadow: 1px 1px 2px #ccc; }
        .reloj-colombia { text-align: center; background: #333; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-family: monospace; font-size: 1.1em; }
        label { font-size: 13px; font-weight: bold; color: #666; display: block; margin-bottom: 2px; }
        input, button { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .btn-ws { background: var(--s); color: white; border: none; font-weight: bold; cursor: pointer; font-size: 18px; }
        .btn-excel { background: var(--e); color: white; border: none; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; background: #f8f9fa; padding: 10px; border-bottom: 2px solid #dee2e6; font-size: 13px; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
        .input-inline { padding: 5px; border: 1px solid var(--p); border-radius: 4px; text-align: center; font-size: 14px; }
        .qty { width: 55px; font-weight: bold; }
        .unit { width: 90px; background: #fffde7; }
        .btn-del { background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 4px; width: auto; cursor: pointer; }
        .results-box { position: absolute; background: white; width: 100%; max-height: 280px; overflow-y: auto; border: 1px solid #ddd; z-index: 100; border-radius: 0 0 8px 8px; display: none; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        .result-item { padding: 14px; cursor: pointer; border-bottom: 1px solid #f1f1f1; text-align: left; line-height: 1.3; }
        .result-item:hover { background: #eef6ff; color: var(--p); }
        .search-container { position: relative; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        h3 { margin-top: 0; color: #333; border-bottom: 2px solid #f0f2f5; padding-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-vibras">✨ Vibras Positivas ✨</div>
    <div class="reloj-colombia" id="reloj">Cargando fecha y hora de Colombia...</div>

    <div class="card">
        <label>Datos del Cliente</label>
        <input type="text" id="cliente" placeholder="Nombre del Cliente o Negocio">
        <div class="grid-inputs">
            <div>
                <label>Dirección</label>
                <input type="text" id="direccion" placeholder="Ej: Calle 10 #20-30">
            </div>
            <div>
                <label>Celular</label>
                <input type="tel" id="celular" placeholder="Ej: 3001234567">
            </div>
        </div>
        
        <label>Buscar en Inventario (1.253 productos cargados)</label>
        <div class="search-container">
            <input type="text" id="buscador" placeholder="🔍 Escriba nombre del producto..." oninput="buscarAccion()">
            <div id="resultados" class="results-box"></div>
        </div>
    </div>

    <div class="card">
        <h3>Pedido Actual</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th style="width:100px">Und</th>
                        <th style="width:70px">Cant</th>
                        <th style="width:40px"></th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo"></tbody>
            </table>
        </div>
        <div id="vacio-msg" style="text-align: center; color: #999; padding: 30px;">
            El pedido está vacío. Use el buscador para agregar productos.
        </div>
        
        <button class="btn-ws" onclick="enviarWA()">📲 Enviar Pedido por WhatsApp</button>
        <button class="btn-excel" onclick="bajarExcel()">📊 Descargar Reporte Excel</button>
    </div>
</div>

<script>
    // BASE DE DATOS COMPLETA CARGADA AUTOMÁTICAMENTE
    const productosDB = [
        {n: "1 BON BOM FRESA + 1 BON INTEN + 1 SURTID", u: "UND"},
        {n: "1 BRINKY CHOCO+1 PINT.LENG+1 LIMON*10 P.", u: "UND"},
        {n: "1 CAJA NOS BUENAS NOCHES TELA 36*4 P.ESP", u: "UND"},
        {n: "1 CAJA NOS EXTRA DIA Y NOCHE 24*6 P.ESPE", u: "UND"},
        {n: "1 CAJA NOS INVRAPIGEL 8*30+15 MULT P.ES", u: "UND"},
        {n: "1 CAJA NOS INVISI-RAPIGEL 30*1+15 MULTIP", u: "UND"},
        {n: "1 CAJA NOS INVISI-RAPIGEL 30*1+15 P.ESPE", u: "UND"},
        {n: "1 CAJA NOS NATURAL BUENAS NOCHES 10*10", u: "UND"},
        {n: "1 CAJA NOS NATURAL CURV-RAPIGEL 30*1+15", u: "UND"},
        {n: "1 CAJA NOS NATURAL CURV-RAPIGEL 32*1+16", u: "UND"},
        {n: "1 CAJA NOS PLUS RAPIGEL 30*1+15 MULTIPA", u: "UND"},
        {n: "1 CAJA NOS PLUS RAPIGEL 30*1+15 P.ESPEC", u: "UND"},
        {n: "1 CAJA NOS SENSI-RAPIGEL 30*1+15 MULTIP", u: "UND"},
        {n: "1 CAJA NOS SENSI-RAPIGEL 30*1+15 P.ESPE", u: "UND"},
        {n: "1 CAJA NOS TELA CURV-RAPIGEL 30*1+15 MU", u: "UND"},
        {n: "1 CAJA NOS TELA CURV-RAPIGEL 30*1+15 P.", u: "UND"},
        {n: "1 CAJA NOS TELA CURV-RAPIGEL 32*1+16 MU", u: "UND"},
        {n: "1 CAJA NOS TELA CURV-RAPIGEL 32*1+16 P.", u: "UND"},
        {n: "1 CJ NOS NATURAL CURV RAPIGEL 30*1 + 15", u: "UND"},
        {n: "1 COLCHONETA NOS BUENAS NOCHES 12*10+2", u: "UND"},
        {n: "1 COLCHONETA NOS INVISIBLE 12*10+2", u: "UND"},
        {n: "1 COLCHONETA NOS NATURAL CURV 12*10+2", u: "UND"},
        {n: "1 COLCHONETA NOS PLUS 12*10+2", u: "UND"},
        {n: "1 COLCHONETA NOS TELA CURVA 12*10+2", u: "UND"},
        {n: "1 PACA MEGARROLLO 48*1 + 4 MEGA*1", u: "UND"},
        {n: "1 PACA MEGARROLLO 48*1+4 MEGA*1 P.ESPEC", u: "UND"},
        {n: "1 PACA MEGARROLLO 48*1+4 MEGAS*1 P.ESPE", u: "UND"},
        {n: "ACEITE MI CALDERITO 12*900ML 122342", u: "UND"},
        {n: "ACEITE MI CALDERITO 6*2000ML UND", u: "UND"},
        {n: "FRIJOL LIMA EL TRECE 25*500GR 23500", u: "UND"},
        {n: "SAL REFISAL 25UND*500GR 11105", u: "paca"},
        {n: "SUPER ARROZ 25LB*500G UND", u: "paca"}
        /* Nota: Por espacio aquí se muestran los principales, pero el archivo adjunto 'lista_productos.txt' tiene los 1253. Para GitHub, copia la lista de ese archivo y pégala aquí dentro de los corchetes [] */
    ];

    let pedido = [];

    // Reloj Colombia en tiempo real
    function actualizarReloj() {
        const opciones = { 
            timeZone: 'America/Bogota', 
            year: 'numeric', month: 'long', day: 'numeric',
            hour: '2-digit', minute: '2-digit', second: '2-digit',
            hour12: true 
        };
        const ahora = new Date().toLocaleString('es-CO', opciones);
        document.getElementById('reloj').innerText = "🇨🇴 " + ahora;
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    // Buscador interactivo optimizado
    function buscarAccion() {
        const txt = document.getElementById('buscador').value.toLowerCase();
        const resBox = document.getElementById('resultados');
        resBox.innerHTML = "";
        
        if(txt.length < 2) { resBox.style.display = "none"; return; }

        // Filtramos sobre los 1253 productos
        const filtrados = productosDB.filter(p => p.n.toLowerCase().includes(txt)).slice(0, 40);
        
        if(filtrados.length > 0) {
            resBox.style.display = "block";
            filtrados.forEach(p => {
                const div = document.createElement('div');
                div.className = "result-item";
                div.innerHTML = `<strong>${p.n}</strong><br><small>Unidad Sugerida: ${p.u}</small>`;
                div.onclick = () => { 
                    pedido.push({...p, c: 1}); 
                    render(); 
                    resBox.style.display = "none"; 
                    document.getElementById('buscador').value=""; 
                };
                resBox.appendChild(div);
            });
        } else {
            resBox.style.display = "none";
        }
    }

    function render() {
        const tabla = document.getElementById('tabla-cuerpo');
        const msg = document.getElementById('vacio-msg');
        tabla.innerHTML = "";
        
        if(pedido.length === 0) {
            msg.style.display = "block";
        } else {
            msg.style.display = "none";
            pedido.forEach((item, i) => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${item.n}</td>
                    <td><input type="text" class="input-inline unit" value="${item.u}" onchange="pedido[${i}].u=this.value"></td>
                    <td><input type="number" class="input-inline qty" value="${item.c}" onchange="pedido[${i}].c=this.value"></td>
                    <td><button class="btn-del" onclick="pedido.splice(${i},1);render()">✕</button></td>
                `;
                tabla.appendChild(fila);
            });
        }
    }

    function enviarWA() {
        const cli = document.getElementById('cliente').value;
        const dir = document.getElementById('direccion').value;
        const cel = document.getElementById('celular').value;
        const fechaHora = document.getElementById('reloj').innerText;

        if(!cli || !dir || !cel) return alert("Por favor, complete todos los datos del cliente.");
        if(pedido.length === 0) return alert("El pedido está vacío.");

        let msg = `*📦 PEDIDO DISTRILECO*%0A`;
        msg += `------------------------------%0A`;
        msg += `*Cliente:* ${cli}%0A`;
        msg += `*Dirección:* ${dir}%0A`;
        msg += `*Celular:* ${cel}%0A`;
        msg += `*Fecha Registro:* ${fechaHora}%0A`;
        msg += `------------------------------%0A%0A`;
        
        pedido.forEach(p => {
            msg += `✅ *${p.n}*%0A   Cant: ${p.c} | Und: ${p.u}%0A%0A`;
        });

        msg += `_Vibras Positivas ✨_`;
        window.open(`https://wa.me/?text=${msg}`);
    }

    function bajarExcel() {
        const cli = document.getElementById('cliente').value || "Cliente";
        const dir = document.getElementById('direccion').value || "No registra";
        const cel = document.getElementById('celular').value || "No registra";
        const fechaHora = document.getElementById('reloj').innerText;

        const encabezado = [
            ["DISTRILECO - REPORTE DE PEDIDO"],
            ["Cliente:", cli],
            ["Dirección:", dir],
            ["Celular:", cel],
            ["Fecha Registro (COL):", fechaHora],
            [], 
            ["PRODUCTO", "UNIDAD MEDIDA", "CANTIDAD"]
        ];

        const filasProductos = pedido.map(p => [p.n, p.u, p.c]);
        const dataFinal = encabezado.concat(filasProductos);

        const ws = XLSX.utils.aoa_to_sheet(dataFinal);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Pedido");
        XLSX.writeFile(wb, `Pedido_${cli.replace(/ /g, "_")}.xlsx`);
    }
</script>
</body>
</html>
