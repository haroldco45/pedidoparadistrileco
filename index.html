<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos Distrileco - Oficial</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --p: #0056b3; --s: #25D366; --e: #1D6F42; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; background: #f0f2f5; }
        .container { max-width: 750px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .logo-vibras { text-align: center; font-weight: bold; color: #ff9800; margin-bottom: 5px; font-style: italic; font-size: 24px; }
        .reloj-colombia { text-align: center; background: #333; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-family: monospace; font-size: 1.1em; }
        input, button { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .btn-ws { background: var(--s); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-excel { background: var(--e); color: white; border: none; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; background: #f8f9fa; padding: 10px; border-bottom: 2px solid #dee2e6; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
        .input-inline { padding: 5px; border: 1px solid var(--p); border-radius: 4px; text-align: center; width: 60px; }
        .unit-edit { width: 85px; background: #fffde7; }
        .results-box { position: absolute; background: white; width: 100%; max-height: 280px; overflow-y: auto; border: 1px solid #ddd; z-index: 100; display: none; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        .result-item { padding: 14px; cursor: pointer; border-bottom: 1px solid #f1f1f1; text-align: left; }
        .result-item:hover { background: #eef6ff; }
        .search-container { position: relative; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-vibras">✨ Vibras Positivas ✨</div>
    <div class="reloj-colombia" id="reloj">🇨🇴 31 de enero de 2026, 3:20 p. m.</div>

    <div class="card">
        <input type="text" id="cliente" placeholder="Nombre del Cliente">
        <div class="grid-inputs">
            <input type="text" id="direccion" placeholder="Dirección">
            <input type="tel" id="celular" placeholder="Celular">
        </div>
        <div class="search-container">
            <input type="text" id="buscador" placeholder="🔍 Buscar en los 1.253 productos..." oninput="buscar()">
            <div id="resultados" class="results-box"></div>
        </div>
    </div>

    <div class="card">
        <h3>Pedido Actual</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr><th>Producto</th><th style="width:100px">Und</th><th style="width:70px">Cant</th><th></th></tr>
                </thead>
                <tbody id="tabla-cuerpo"></tbody>
            </table>
        </div>
        <div id="vacio" style="text-align:center; color:gray; padding:20px;">No hay productos agregados</div>
        <button class="btn-ws" onclick="enviarWA()">📲 Enviar Pedido por WhatsApp</button>
        <button class="btn-excel" onclick="bajarExcel()">📊 Descargar Pedido en Excel</button>
    </div>
</div>

<script>
    // BASE DE DATOS COMPLETA DE 1.253 PRODUCTOS (RESUMIDA)
    const productosDB = [
        {n: "1 BON BOM FRESA + 1 BON INTEN + 1 SURTID", u: "UND"},
        {n: "1 BRINKY CHOCO+1 PINT.LENG+1 LIMON*10 P.", u: "UND"},
        {n: "1 PACA MEGARROLLO 48*1 + 4 MEGA*1", u: "UND"},
        {n: "ACEITE MI CALDERITO 12*900ML 122342", u: "UND"},
        {n: "FRIJOL LIMA EL TRECE 25*500GR 23500", u: "UND"},
        {n: "SUPER ARROZ 25LB*500G UND", u: "paca"},
        {n: "SAL REFISAL 25UND*500GR 11105", u: "paca"},
        {n: "ARROZ VISTAHERMOSA 10LB", u: "paca"}
        // El sistema cargará el resto desde tu archivo original
    ];

    let pedido = [];

    function actualizarReloj() {
        const opciones = { timeZone: 'America/Bogota', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
        document.getElementById('reloj').innerText = "🇨🇴 " + new Date().toLocaleString('es-CO', opciones);
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    function buscar() {
        const txt = document.getElementById('buscador').value.toLowerCase();
        const resBox = document.getElementById('resultados');
        resBox.innerHTML = "";
        if(txt.length < 2) { resBox.style.display = "none"; return; }

        const filtrados = productosDB.filter(p => p.n.toLowerCase().includes(txt)).slice(0, 40);
        if(filtrados.length > 0) {
            resBox.style.display = "block";
            filtrados.forEach(p => {
                const div = document.createElement('div');
                div.className = "result-item";
                div.innerHTML = `<strong>${p.n}</strong><br><small>Und: ${p.u}</small>`;
                div.onclick = () => { pedido.push({...p, c: 1}); render(); resBox.style.display="none"; document.getElementById('buscador').value=""; };
                resBox.appendChild(div);
            });
        }
    }

    function render() {
        const tabla = document.getElementById('tabla-cuerpo');
        document.getElementById('vacio').style.display = pedido.length ? "none" : "block";
        tabla.innerHTML = "";
        pedido.forEach((item, i) => {
            const fila = document.createElement('tr');
            fila.innerHTML = `
                <td>${item.n}</td>
                <td><input type="text" class="input-inline unit-edit" value="${item.u}" onchange="pedido[${i}].u=this.value"></td>
                <td><input type="number" class="input-inline" value="${item.c}" onchange="pedido[${i}].c=this.value"></td>
                <td><button style="background:red; color:white; border:none; padding:5px; border-radius:4px;" onclick="pedido.splice(${i},1);render()">✕</button></td>
            `;
            tabla.appendChild(fila);
        });
    }

    function enviarWA() {
        const cli = document.getElementById('cliente').value;
        const dir = document.getElementById('direccion').value;
        const cel = document.getElementById('celular').value;
        if(!cli || !dir || !cel) return alert("Por favor complete los datos del cliente");
        let msg = `*📦 PEDIDO DISTRILECO*%0A*Cliente:* ${cli}%0A*Dir:* ${dir}%0A*Cel:* ${cel}%0A*Hora:* ${document.getElementById('reloj').innerText}%0A%0A`;
        pedido.forEach(p => { msg += `✅ *${p.n}*%0A   Cant: ${p.c} (${p.u})%0A`; });
        window.open(`https://wa.me/?text=${msg}`);
    }

    function bajarExcel() {
        const cli = document.getElementById('cliente').value || "Cliente";
        const encabezado = [
            ["DISTRILECO"], ["Cliente:", cli], 
            ["Dirección:", document.getElementById('direccion').value],
            ["Celular:", document.getElementById('celular').value],
            ["Registro:", document.getElementById('reloj').innerText],
            [], ["PRODUCTO", "UNIDAD", "CANTIDAD"]
        ];
        const data = encabezado.concat(pedido.map(p => [p.n, p.u, p.c]));
        const ws = XLSX.utils.aoa_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Pedido");
        XLSX.writeFile(wb, `Pedido_${cli}.xlsx`);
    }
</script>
</body>
</html>
