<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos Distrileco - Oficial</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --p: #0056b3; --s: #25D366; --e: #1D6F42; --accent: #ff9800; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; background: #f0f2f5; }
        .container { max-width: 750px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .logo-vibras { text-align: center; font-weight: bold; color: var(--accent); margin-bottom: 5px; font-style: italic; font-size: 24px; }
        .reloj-colombia { text-align: center; background: #2c3e50; color: #fff; padding: 10px; border-radius: 10px; margin-bottom: 15px; font-family: monospace; font-size: 1.1em; }
        input, button { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .btn-ws { background: var(--s); color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-excel { background: var(--e); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-add-manual { background: var(--accent); color: white; border: none; font-weight: bold; padding: 8px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; background: #f8f9fa; padding: 10px; border-bottom: 2px solid #dee2e6; font-size: 13px; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
        .results-box { position: absolute; background: white; width: 100%; max-height: 280px; overflow-y: auto; border: 1px solid #ddd; z-index: 100; display: none; border-radius: 0 0 10px 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        .result-item { padding: 14px; cursor: pointer; border-bottom: 1px solid #f1f1f1; text-align: left; }
        .result-item:hover { background: #f0f7ff; }
        .search-container { position: relative; }
        .manual-box { border: 2px dashed var(--accent); padding: 15px; border-radius: 10px; background: #fffdf5; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-vibras">✨ Vibras Positivas ✨</div>
    <div class="reloj-colombia" id="reloj">Cargando hora de Colombia...</div>

    <div class="card">
        <label>Información del Cliente</label>
        <input type="text" id="cliente" placeholder="Nombre o Negocio">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <input type="text" id="direccion" placeholder="Dirección">
            <input type="tel" id="celular" placeholder="Celular">
        </div>
        
        <label>Buscar Producto</label>
        <div class="search-container">
            <input type="text" id="buscador" placeholder="🔍 Escriba para buscar..." oninput="buscarAccion()">
            <div id="resultados" class="results-box"></div>
        </div>

        <div class="manual-box">
            <label style="color: var(--accent);">¿Producto nuevo? Agréguelo aquí:</label>
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px;">
                <input type="text" id="manual-nombre" placeholder="Nombre artículo">
                <input type="text" id="manual-unidad" placeholder="Und (Paca/Kg)">
            </div>
            <button class="btn-add-manual" onclick="agregarManual()">+ Agregar al Pedido</button>
        </div>
    </div>

    <div class="card">
        <h3>Lista de Pedido</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr><th>Producto</th><th>Und</th><th>Cant</th><th></th></tr>
                </thead>
                <tbody id="tabla-cuerpo"></tbody>
            </table>
        </div>
        <button class="btn-ws" onclick="enviarWA()">📲 Enviar WhatsApp</button>
        <button class="btn-excel" onclick="bajarExcel()">📊 Descargar Excel</button>
    </div>
</div>

    let pedido = [];

    function actualizarReloj() {
        const opciones = { timeZone: 'America/Bogota', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
        document.getElementById('reloj').innerText = "🇨🇴 " + new Date().toLocaleString('es-CO', opciones);
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    function buscarAccion() {
        const txt = document.getElementById('buscador').value.toLowerCase();
        const resBox = document.getElementById('resultados');
        resBox.innerHTML = "";
        if(txt.length < 2) { resBox.style.display = "none"; return; }
        const filtrados = productosDB.filter(p => p.n.toLowerCase().includes(txt)).slice(0, 30);
        if(filtrados.length > 0) {
            resBox.style.display = "block";
            filtrados.forEach(p => {
                const div = document.createElement('div');
                div.className = "result-item";
                div.innerHTML = `<strong>${p.n}</strong><br><small>Unidad sugerida: ${p.u}</small>`;
                div.onclick = () => { 
                    pedido.push({...p, c: 1}); 
                    render(); 
                    resBox.style.display = "none"; 
                    document.getElementById('buscador').value=""; 
                };
                resBox.appendChild(div);
            });
        }
    }

    function agregarManual() {
        const nom = document.getElementById('manual-nombre').value.toUpperCase();
        const und = document.getElementById('manual-unidad').value.toUpperCase() || "UND";
        if(!nom) return alert("Escriba el nombre");
        pedido.push({ n: nom, u: und, c: 1 });
        render();
        document.getElementById('manual-nombre').value = "";
        document.getElementById('manual-unidad').value = "";
    }

    function render() {
        const tabla = document.getElementById('tabla-cuerpo');
        tabla.innerHTML = "";
        pedido.forEach((item, i) => {
            const fila = document.createElement('tr');
            fila.innerHTML = `
                <td><small>${item.n}</small></td>
                <td><input type="text" style="width:70px; padding:5px;" value="${item.u}" onchange="pedido[${i}].u=this.value"></td>
                <td><input type="number" style="width:50px; padding:5px;" value="${item.c}" onchange="pedido[${i}].c=this.value"></td>
                <td><button style="background:red; color:white; border:none; padding:5px; border-radius:5px; cursor:pointer;" onclick="pedido.splice(${i},1);render()">✕</button></td>
            `;
            tabla.appendChild(fila);
        });
    }

    function enviarWA() {
        const cli = document.getElementById('cliente').value;
        const dir = document.getElementById('direccion').value;
        const cel = document.getElementById('celular').value;
        if(!cli || !dir || !cel) return alert("Complete los datos del cliente");
        if(pedido.length === 0) return alert("El pedido está vacío");
        
        let msg = `*📦 PEDIDO DISTRILECO*%0A*Cliente:* ${cli}%0A*Dir:* ${dir}%0A*Cel:* ${cel}%0A*Hora:* ${document.getElementById('reloj').innerText}%0A%0A`;
        pedido.forEach(p => msg += `✅ ${p.n}%0A    Cant: ${p.c} (${p.u})%0A%0A`);
        window.open(`https://wa.me/?text=${msg}`);
    }

    function bajarExcel() {
        if(pedido.length === 0) return alert("El pedido está vacío");
        const cli = document.getElementById('cliente').value || "Cliente";
        const encabezado = [
            ["DISTRILECO"], 
            ["Cliente:", cli], 
            ["Dirección:", document.getElementById('direccion').value], 
            ["Registro:", document.getElementById('reloj').innerText],
            [], 
            ["PRODUCTO", "UNIDAD", "CANTIDAD"]
        ];
        const data = encabezado.concat(pedido.map(p => [p.n, p.u, p.c]));
        const ws = XLSX.utils.aoa_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Pedido");
        XLSX.writeFile(wb, `Pedido_${cli}.xlsx`);
    }
